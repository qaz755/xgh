<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F0E4">
<meta name="description" content="40道生活化选择题，测出你灵魂里的中国历史人物底色。趣味人格测试，仅供娱乐。">
<title>测测你的灵魂对应哪位中国历史人物</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ===================== 基础与变量 ===================== */
:root{
  --paper:#F5F0E4;
  --paper-2:#EFE8D8;
  --ink:#23211D;
  --ink-2:#5C574D;
  --ink-3:#8C8577;
  --cinnabar:#9E2B25;
  --cinnabar-soft:#C0564F;
  --jade:#3E5C54;
  --gold:#B08A4C;
  --line:rgba(35,33,29,.14);
  --shadow:0 18px 46px -22px rgba(40,32,20,.42);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  min-height:100dvh;
  overflow-x:hidden;
  position:relative;
  line-height:1.7;
}
/* 宣纸质感：三层极淡纹理 */
body::before{
  content:"";
  position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(circle at 18% 8%, rgba(176,138,76,.10), transparent 42%),
    radial-gradient(circle at 84% 92%, rgba(62,92,84,.10), transparent 46%),
    radial-gradient(1200px 700px at 50% 40%, #F8F4E9 0%, #F2ECDE 62%, #EBE3D2 100%);
}
body::after{
  content:"";
  position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:
    repeating-linear-gradient(0deg, rgba(120,104,74,.055) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(120,104,74,.045) 0 1px, transparent 1px 4px);
  mix-blend-mode:multiply;
}
img{max-width:100%;display:block;}

/* ===================== 版心 ===================== */
.shell{
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:0 20px calc(28px + env(safe-area-inset-bottom));
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
.view{width:100%;flex:1;display:flex;flex-direction:column;}
.view[hidden]{display:none !important;}

/* ===================== 通用小件 ===================== */
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line) 18%,var(--line) 82%,transparent);}
.kicker{
  font-family:var(--sans);
  font-size:11px;letter-spacing:.34em;
  color:var(--ink-3);
  text-align:center;
}
.btn{
  appearance:none;border:none;cursor:pointer;
  font-family:var(--serif);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .26s cubic-bezier(.3,1.2,.4,1),box-shadow .26s,background .26s,color .26s,opacity .26s;
}
.btn:active{transform:scale(.972);}

/* ===================== 首页 ===================== */
.intro{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:calc(34px + env(safe-area-inset-top)) 0 24px;
  text-align:center;
  animation:rise .8s cubic-bezier(.22,.9,.28,1) both;
}
.intro-seal{
  width:66px;height:66px;margin:0 auto 26px;
  border:1.5px solid var(--cinnabar);
  border-radius:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--cinnabar);
  font-family:var(--serif);font-weight:700;
  font-size:17px;letter-spacing:.14em;
  transform:rotate(-3.5deg);
  box-shadow:inset 0 0 0 3px rgba(245,240,228,.9),inset 0 0 0 4px rgba(158,43,37,.28);
  opacity:.92;
}
.intro-seal b{display:block;line-height:1.18;font-weight:700;}
.intro h1{
  font-family:var(--serif);
  font-weight:900;
  font-size:clamp(25px,7.4vw,33px);
  line-height:1.46;
  letter-spacing:.06em;
  color:var(--ink);
}
.intro h1 .hl{
  color:var(--cinnabar);
  position:relative;
  white-space:nowrap;
}
.intro h1 .hl::after{
  content:"";position:absolute;left:0;right:0;bottom:-2px;height:6px;
  background:linear-gradient(90deg,rgba(158,43,37,.16),rgba(158,43,37,.3));
  border-radius:50%/60% 42% 58% 40%;
}
.intro .lead{
  margin:20px auto 0;
  max-width:320px;
  font-size:13.5px;color:var(--ink-2);line-height:2;
  letter-spacing:.02em;
}
.intro .meta{
  margin:26px auto 0;
  display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:11.5px;letter-spacing:.12em;color:var(--ink-3);
}
.intro .meta i{width:3px;height:3px;border-radius:50%;background:var(--gold);}
.intro-start{
  margin:34px auto 0;
  width:min(260px,72%);
  padding:15px 26px;
  border-radius:2px;
  background:var(--cinnabar);
  color:#FDF8EC;
  font-size:15.5px;letter-spacing:.22em;font-weight:600;
  box-shadow:0 14px 26px -14px rgba(158,43,37,.72),inset 0 0 0 1px rgba(255,255,255,.12);
}
.intro-start:hover{background:#8E241F;}
.intro-note{
  margin:18px auto 0;
  font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;line-height:1.9;
  max-width:300px;
}
.intro-foot{
  margin-top:auto;padding-top:30px;
  font-size:10.5px;letter-spacing:.2em;color:var(--ink-3);opacity:.8;
}

/* ===================== 答题页 ===================== */
.quiz{padding:calc(18px + env(safe-area-inset-top)) 0 10px;display:flex;flex-direction:column;flex:1;}
.quiz-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-size:12px;letter-spacing:.1em;color:var(--ink-2);
}
.qcount{font-family:var(--serif);}
.qcount em{
  font-style:normal;color:var(--cinnabar);font-weight:700;font-size:17px;letter-spacing:.02em;
}
.qcount span{color:var(--ink-3);font-size:11.5px;}
.back-btn{
  appearance:none;border:none;background:transparent;cursor:pointer;
  font-family:var(--sans);font-size:11.5px;letter-spacing:.1em;color:var(--ink-3);
  padding:6px 2px;transition:color .22s,opacity .22s;
}
.back-btn:hover{color:var(--cinnabar);}
.back-btn[disabled]{opacity:0;pointer-events:none;}

.progress{
  position:relative;height:3px;margin:14px 0 30px;
  background:rgba(35,33,29,.10);
  border-radius:3px;
}
.progress .fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;
  background:linear-gradient(90deg,#B9905A,var(--cinnabar) 88%);
  border-radius:3px;
  transition:width .55s cubic-bezier(.3,.9,.3,1);
}
.progress .dot{
  position:absolute;top:50%;left:0;
  width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  border-radius:50%;
  background:#FDF8EC;
  box-shadow:0 0 0 1.5px var(--cinnabar),0 0 10px rgba(158,43,37,.45);
  transition:left .55s cubic-bezier(.3,.9,.3,1);
}

.qcard{animation:cardIn .5s cubic-bezier(.22,.9,.3,1) both;}
.qcard.out{animation:cardOut .26s ease both;}
.qtag{
  font-family:var(--serif);font-size:11px;letter-spacing:.3em;color:var(--gold);
  margin-bottom:12px;
}
.qtag::after{
  content:"";display:inline-block;width:26px;height:1px;background:var(--gold);
  vertical-align:middle;margin-left:10px;opacity:.6;
}
.qtext{
  font-family:var(--serif);
  font-weight:600;
  font-size:clamp(19px,5.3vw,22px);
  line-height:1.66;
  letter-spacing:.03em;
  color:var(--ink);
  margin-bottom:26px;
  min-height:4.4em;
}
.opts{display:flex;flex-direction:column;gap:11px;}
.opt{
  position:relative;
  display:flex;align-items:flex-start;gap:13px;
  width:100%;text-align:left;
  padding:15px 16px;
  background:rgba(255,252,243,.62);
  border:1px solid rgba(35,33,29,.13);
  border-radius:2px;
  cursor:pointer;
  font-family:var(--sans);
  font-size:14.5px;line-height:1.72;
  color:var(--ink);
  transition:border-color .26s,background .26s,transform .2s,box-shadow .26s,color .26s;
}
.opt:hover{
  background:rgba(255,253,247,.95);
  border-color:rgba(158,43,37,.42);
  transform:translateX(2px);
  box-shadow:0 10px 22px -18px rgba(60,45,25,.7);
}
.opt .num{
  flex:0 0 auto;
  font-family:var(--serif);
  font-size:12px;font-weight:600;
  color:var(--ink-3);
  width:20px;height:20px;line-height:20px;text-align:center;
  border:1px solid rgba(35,33,29,.18);
  border-radius:1px;
  margin-top:4px;
  transition:color .26s,border-color .26s,background .26s;
}
.opt.sel{
  border-color:var(--cinnabar);
  background:rgba(158,43,37,.07);
  box-shadow:inset 0 0 0 1px rgba(158,43,37,.28);
  transform:translateX(2px);
}
.opt.sel .num{
  color:#FDF8EC;background:var(--cinnabar);border-color:var(--cinnabar);
}
.quiz-hint{
  margin-top:auto;padding-top:22px;
  text-align:center;font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);opacity:.72;
}

/* ===================== 结果页 ===================== */
.result{padding:calc(16px + env(safe-area-inset-top)) 0 0;animation:rise .62s cubic-bezier(.22,.9,.3,1) both;}
.result-top{text-align:center;margin-bottom:16px;}
.result-top .tag{
  font-family:var(--serif);font-size:11px;letter-spacing:.42em;color:var(--ink-3);
}

/* 分享卡 */
.poster{
  position:relative;
  background:
    radial-gradient(circle at 50% 0%, rgba(176,138,76,.10), transparent 46%),
    linear-gradient(180deg,#FFFDF6 0%,#FAF4E6 100%);
  border:1px solid rgba(35,33,29,.14);
  border-radius:3px;
  padding:30px 22px 30px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.poster::before{
  content:"";position:absolute;inset:9px;pointer-events:none;
  border:1px solid rgba(176,138,76,.34);
  border-radius:1px;
}
.poster .corner{position:absolute;width:16px;height:16px;pointer-events:none;opacity:.55;}
.corner::before,.corner::after{content:"";position:absolute;background:var(--gold);}
.corner::before{width:16px;height:1px;}
.corner::after{width:1px;height:16px;}
.c-tl{top:16px;left:16px;}
.c-tr{top:16px;right:16px;transform:rotate(90deg);}
.c-bl{bottom:16px;left:16px;transform:rotate(-90deg);}
.c-br{bottom:16px;right:16px;transform:rotate(180deg);}

.poster-body{position:relative;z-index:2;}
.p-label{
  text-align:center;font-family:var(--serif);font-size:10.5px;letter-spacing:.44em;
  color:var(--ink-3);
}
.p-label b{display:block;font-weight:400;}
.p-hero{
  display:flex;align-items:center;gap:16px;
  margin:22px 0 20px;
  padding:0 4px;
}
.seal-big{
  flex:0 0 auto;
  width:62px;height:84px;
  border:2px solid var(--cinnabar);
  border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--cinnabar);
  font-family:var(--serif);font-weight:900;
  font-size:19px;letter-spacing:.1em;
  line-height:1.16;
  transform:rotate(-2.5deg);
  box-shadow:inset 0 0 0 3px #FFFDF7,inset 0 0 0 4px rgba(158,43,37,.3);
  background:rgba(158,43,37,.045);
}
.p-name{flex:1;min-width:0;}
.p-name h2{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(28px,8vw,34px);
  letter-spacing:.12em;line-height:1.24;
  color:var(--ink);
}
.p-name .sub{
  margin-top:7px;font-size:11.5px;letter-spacing:.14em;color:var(--ink-2);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
}
.p-name .sub .arche{
  color:#FFF8EA;background:var(--cinnabar);
  padding:2.5px 8px;border-radius:1px;
  font-size:10.5px;letter-spacing:.16em;
}

.p-sync{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  padding:12px 4px;
  border-top:1px solid rgba(35,33,29,.10);
  border-bottom:1px solid rgba(35,33,29,.10);
}
.p-sync .k{font-size:11px;letter-spacing:.18em;color:var(--ink-3);}
.p-sync .v{display:flex;align-items:baseline;gap:3px;}
.p-sync .v em{
  font-style:normal;font-family:var(--serif);font-weight:900;font-size:28px;
  color:var(--cinnabar);letter-spacing:.02em;line-height:1;
}
.p-sync .v i{font-style:normal;font-size:12px;color:var(--cinnabar);opacity:.8;}

.tags{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0 0;}
.tags span{
  font-family:var(--serif);font-size:11.5px;letter-spacing:.1em;
  color:var(--ink-2);
  padding:4.5px 11px;
  border:1px solid rgba(35,33,29,.16);
  border-radius:1px;
  background:rgba(255,255,255,.42);
}

.bars-cap{
  margin-top:22px;text-align:center;
  font-size:10px;letter-spacing:.28em;color:var(--ink-3);
}
.bars{margin:13px 0 0;display:flex;flex-direction:column;gap:9px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-row .bn{
  flex:0 0 42px;font-family:var(--serif);font-size:11.5px;letter-spacing:.06em;
  color:var(--ink-2);
}
.bar-row .track{
  position:relative;flex:1;height:6px;background:rgba(35,33,29,.08);border-radius:3px;overflow:hidden;
}
.bar-row .bar{
  position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,rgba(176,138,76,.55),rgba(176,138,76,.9));
  border-radius:3px;
  transition:width 1s cubic-bezier(.2,.9,.3,1);
}
.bar-row.top .bar{background:linear-gradient(90deg,var(--cinnabar-soft),var(--cinnabar));}
.bar-row.top .bn{color:var(--cinnabar);font-weight:700;}
.bar-row .bv{
  flex:0 0 30px;text-align:right;font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}

.sect{margin-top:24px;}
.sect-t{
  display:flex;align-items:center;gap:8px;
  font-family:var(--serif);font-size:12.5px;letter-spacing:.16em;color:var(--ink);
  margin-bottom:9px;
}
.sect-t::before{
  content:"";width:4px;height:12px;background:var(--cinnabar);opacity:.8;border-radius:1px;
}
.sect p{
  font-size:13.5px;line-height:2;color:var(--ink-2);letter-spacing:.015em;
  text-align:justify;
}
.sect .accent{
  color:var(--ink);font-weight:500;
  background:linear-gradient(180deg,transparent 62%,rgba(176,138,76,.22) 62%);
}

.quote{
  margin:26px 0 0;
  padding:18px 18px 16px;
  background:rgba(158,43,37,.055);
  border-left:3px solid rgba(158,43,37,.55);
  border-radius:1px;
  position:relative;
}
.quote .qm{
  font-family:var(--serif);font-size:30px;line-height:0;color:var(--cinnabar);opacity:.35;
  position:absolute;left:14px;top:22px;
}
.quote q{
  display:block;
  font-family:var(--serif);font-size:14.5px;line-height:1.95;
  letter-spacing:.03em;color:var(--ink);
  quotes:none;
  padding-left:16px;
}
.quote .who{
  display:block;margin-top:10px;padding-left:16px;
  font-size:10.5px;letter-spacing:.2em;color:var(--ink-3);
}

.p-foot{
  margin-top:26px;padding-top:14px;padding-right:4px;
  border-top:1px solid rgba(35,33,29,.10);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.p-foot .f1{
  font-family:var(--serif);font-size:11px;letter-spacing:.14em;color:var(--ink-2);
}
.p-foot .f1 b{color:var(--cinnabar);font-weight:700;}
.p-foot .f2{font-size:9.5px;letter-spacing:.12em;color:var(--ink-3);text-align:right;line-height:1.6;}

/* 操作区 */
.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;}
.actions .btn{
  flex:1 1 0;min-width:120px;
  padding:14px 12px;
  font-size:13.5px;letter-spacing:.16em;
  border-radius:2px;
}
.btn-primary{
  background:var(--cinnabar);color:#FDF8EC;
  box-shadow:0 12px 24px -14px rgba(158,43,37,.8);
}
.btn-ghost{
  background:transparent;color:var(--ink);
  border:1px solid rgba(35,33,29,.22);
}
.btn-ghost:hover{border-color:var(--cinnabar);color:var(--cinnabar);}
.tip{
  margin-top:14px;text-align:center;
  font-size:11px;letter-spacing:.08em;color:var(--ink-3);line-height:1.9;
}
.toast{
  position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);
  background:rgba(35,33,29,.92);color:#FDF8EC;
  font-size:12px;letter-spacing:.06em;
  padding:9px 18px;border-radius:20px;
  opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;
  z-index:60;white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* ===================== 动画 ===================== */
@keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
@keyframes cardIn{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
@keyframes cardOut{from{opacity:1;transform:none;}to{opacity:0;transform:translateX(-22px);}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ===================== 大屏适配 ===================== */
@media (min-width:768px){
  .shell{max-width:600px;padding:0 26px 40px;}
  .qtext{font-size:23px;}
  .opt{font-size:15px;}
  .poster{padding:38px 32px 30px;}
}
@media (min-width:1100px){
  body::before{
    background:
      radial-gradient(circle at 12% 10%, rgba(176,138,76,.16), transparent 40%),
      radial-gradient(circle at 88% 88%, rgba(62,92,84,.16), transparent 44%),
      linear-gradient(180deg,#F6F1E5,#EDE5D3);
  }
}
</style>
</head>
<body>

<div class="shell">

  <!-- ============ 视图：首页 ============ -->
  <section class="view intro" id="view-intro">
    <div class="intro-seal"><b>灵</b><b>魂</b></div>
    <div class="kicker">CHINESE · SOUL · ARCHETYPE</div>
    <h1 style="margin-top:18px;">测测你的灵魂<br>对应哪位<span class="hl">中国历史人物</span></h1>
    <p class="lead">不讲历史知识，只问你怎么过日子。<br>四十道生活化的选择题，照见你骨子里的那点底色。</p>
    <div class="meta"><span>40 题</span><i></i><span>约 4 分钟</span><i></i><span>无需注册</span></div>
    <button class="btn intro-start" id="startBtn">开 始 测 试</button>
    <p class="intro-note">没有标准答案，选最像你第一反应的那一项。<br>趣味人格测试 · 非历史考试 · 非心理诊断</p>
    <div class="intro-foot">七种人格底色 · 十四位历史人物</div>
  </section>

  <!-- ============ 视图：答题 ============ -->
  <section class="view quiz" id="view-quiz" hidden>
    <div class="quiz-head">
      <div class="qcount">第 <em id="qNow">01</em> <span>/ 40 题</span></div>
      <button class="back-btn" id="backBtn" disabled>← 上一题</button>
    </div>
    <div class="progress">
      <div class="fill" id="pFill"></div>
      <div class="dot" id="pDot"></div>
    </div>
    <div class="qcard" id="qcard">
      <div class="qtag" id="qtag">日常</div>
      <h2 class="qtext" id="qtext">题目</h2>
      <div class="opts" id="opts"></div>
    </div>
    <div class="quiz-hint" id="quizHint">选择后自动进入下一题 · 电脑可按 1 2 3 4</div>
  </section>

  <!-- ============ 视图：结果 ============ -->
  <section class="view result" id="view-result" hidden>
    <div class="result-top"><div class="tag">你 的 灵 魂 图 谱</div></div>
    <div class="poster" id="poster">
      <div class="corner c-tl"></div><div class="corner c-tr"></div>
      <div class="corner c-bl"></div><div class="corner c-br"></div>
      <div class="poster-body" id="posterBody"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="againBtn">再 测 一 次</button>

      adv:'你能在长期被低估的情况下，依然保持锋利。',

      adv:'你能从任何困局里抽身出来，从更高处再看一遍。',

/* 第二位人格落在这些维度时，选 a / b */
const VARIANT_RULE = {
  emperor:    s => ['strategist','scholar'].includes(s) ? 'a' : 'b',
  strategist: s => ['scholar','poet','hermit'].includes(s) ? 'b' : 'a',
  scholar:    s => ['poet','hermit','knight'].includes(s) ? 'a' : 'b',
  knight:     s => ['emperor','general','strategist'].includes(s) ? 'a' : 'b',
  poet:       s => ['general','knight','strategist'].includes(s) ? 'b' : 'a',
  general:    s => ['emperor','strategist'].includes(s) ? 'a' : 'b',
  hermit:     s => ['poet','scholar'].includes(s) ? 'a' : 'b'
};

/* ============================================================
   4. 状态与工具
   ============================================================ */
const TOTAL = QS.length;
const state = {
  view: 'intro',
  idx: 0,
  answers: new Array(TOTAL).fill(null),
  busy: false
};

const $ = id => document.getElementById(id);
const views = { intro:$('view-intro'), quiz:$('view-quiz'), result:$('view-result') };

function show(v){
  Object.keys(views).forEach(k => { views[k].hidden = (k !== v); });
  state.view = v;
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 1800);
}

/* 每个维度的「出场次数」，用于归一化，避免某维度题多就占便宜 */
const EXPOSURE = (() => {
  const c = {}; DIM_KEYS.forEach(k => c[k] = 0);
  QS.forEach(q => q.opts.forEach(o => c[o[1]]++));
  return c;
})();

/* ============================================================
   5. 计分
   ============================================================ */
function score(){
  const raw = {}; DIM_KEYS.forEach(k => raw[k] = 0);
  let answered = 0;
  state.answers.forEach((ai, i) => {
    if (ai === null) return;
    answered++;
    const dim = QS[i].opts[ai][1];
    if (raw[dim] !== undefined) raw[dim] += 3;
  });
  const norm = {};
  DIM_KEYS.forEach(k => {
    norm[k] = EXPOSURE[k] ? raw[k] / EXPOSURE[k] : 0; // 0 ~ 3
  });
  return { raw, norm, answered };
}

function rank(norm){
  return DIM_KEYS.slice().sort((a, b) => {
    if (Math.abs(norm[b] - norm[a]) > 1e-9) return norm[b] - norm[a];
    return TIE_ORDER.indexOf(a) - TIE_ORDER.indexOf(b);
  });
}

function buildResult(){
  const { raw, norm, answered } = score();
  const order = rank(norm);
  const top = order[0];
  const second = order[1];
  const third = order[2];

  const variant = VARIANT_RULE[top](second);
  const fig = FIGURES[top][variant];

  /* 同频度：靠「第一名与第二名拉开多少」来算，不虚构精确度 */
  const gap = norm[top] > 0 ? (norm[top] - norm[second]) / norm[top] : 0;
  let sync = Math.round(66 + 32 * Math.max(0, gap));
  sync = Math.max(68, Math.min(95, sync));
  if (answered < TOTAL) sync = Math.min(sync, 90);

  /* 条形图按「最强的那个维度 = 100%」等比缩放，视觉上更好读 */
  const peak = Math.max(norm[top], 0.001);
  const percent = {};
  DIM_KEYS.forEach(k => {
    percent[k] = Math.max(9, Math.min(100, Math.round(norm[k] / peak * 100)));
  });

  return {
    top, second, third, fig, sync, percent, norm, answered,
    secondName: DIMS[second].name,
    secondFigure: FIGURES[second][VARIANT_RULE[second](third)].name
  };
}

/* ============================================================
   6. 答题页渲染
   ============================================================ */
const NUMERALS = ['一','二','三','四'];

function renderQuiz(dir){
  const i = state.idx;
  const q = QS[i];

  $('qNow').textContent = String(i + 1).padStart(2, '0');
  $('qtag').textContent = q.sec;
  $('qtext').textContent = q.q;

  const pct = (i / TOTAL) * 100;
  $('pFill').style.width = pct + '%';
  $('pDot').style.left = pct + '%';

  const box = $('opts');
  box.innerHTML = '';
  q.opts.forEach((o, oi) => {
    const b = document.createElement('button');
    b.className = 'opt' + (state.answers[i] === oi ? ' sel' : '');
    b.type = 'button';
    b.innerHTML = '<span class="num">' + NUMERALS[oi] + '</span><span class="txt"></span>';
    b.querySelector('.txt').textContent = o[0];
    b.addEventListener('click', () => choose(oi));
    box.appendChild(b);
  });

  $('backBtn').disabled = (i === 0);
  $('quizHint').textContent = i === 0 ? '选一个最像你的 · 电脑可按 1 2 3 4 键' : '选择后自动进入下一题';

  const card = $('qcard');
  card.classList.remove('out');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';
}

function choose(oi){
  if (state.busy) return;
  state.busy = true;
  state.answers[state.idx] = oi;

  // 高亮选中项
  const btns = Array.from($('opts').children);
  btns.forEach((b, k) => b.classList.toggle('sel', k === oi));

  setTimeout(() => {
    const card = $('qcard');
    card.classList.add('out');
    setTimeout(() => {
      card.classList.remove('out');
      if (state.idx < TOTAL - 1){
        state.idx++;
        renderQuiz();
        state.busy = false;
      } else {
        finish();
        state.busy = false;
      }
    }, 240);
  }, 190);
}

function back(){
  if (state.busy || state.idx === 0) return;
  state.idx--;
  renderQuiz();
}

/* ============================================================
   7. 结果页渲染
   ============================================================ */
function renderResult(){
  const r = buildResult();
  const f = r.fig;
  const arche = DIMS[r.top].name;

  const bars = DIM_KEYS
    .slice()
    .sort((a, b) => r.percent[b] - r.percent[a])
    .map(k => `
      <div class="bar-row ${k === r.top ? 'top' : ''}">
        <div class="bn">${DIMS[k].name}</div>
        <div class="track"><div class="bar" data-w="${r.percent[k]}"></div></div>
        <div class="bv">${r.percent[k]}%</div>
      </div>`).join('');

  $('posterBody').innerHTML = `
    <div class="p-label"><b>灵 魂 人 格 图 谱</b>SOUL ARCHETYPE</div>

    <div class="p-hero">
      <div class="seal-big"><span>${arche[0]}</span><span>${arche[1]}</span></div>
      <div class="p-name">
        <h2>${f.name}</h2>
        <div class="sub">
          <span class="arche">${arche}型</span>
          <span>${f.dyn} · ${f.title}</span>
        </div>
      </div>
    </div>

    <div class="p-sync">
      <div class="k">灵 魂 同 频 度</div>
      <div class="v"><em>${r.sync}</em><i>%</i></div>
    </div>

    <div class="tags">${f.tags.map(t => `<span>${t}</span>`).join('')}</div>

    <div class="bars-cap">七 维 人 格 底 色 分 布</div>
    <div class="bars">${bars}</div>

    <div class="sect">
      <div class="sect-t">为 什 么 是 他</div>
      <p>${f.reason}</p>
    </div>

    <div class="sect">
      <div class="sect-t">你 的 隐 藏 优 势</div>
      <p>${f.adv}</p>
    </div>

    <div class="sect">
      <div class="sect-t">趣 味 彩 蛋</div>
      <p>${f.egg}</p>
    </div>

    <div class="quote">
      <span class="qm">“</span>
      <q>${f.quote}</q>
      <span class="who">—— 说 给 ${f.name} 型 的 你</span>
    </div>

    <div class="p-foot">
      <div class="f1">第二底色：<b>${r.secondName}</b> · ${r.secondFigure}</div>
      <div class="f2">趣味人格测试<br>仅供娱乐 · 非心理诊断</div>
    </div>
  `;

  // 条形图延迟动画
  requestAnimationFrame(() => {
    setTimeout(() => {
      $('posterBody').querySelectorAll('.bar').forEach(b => {
        b.style.width = b.dataset.w + '%';
      });
    }, 60);
  });

  buildCopyText(r);
}

let copyCache = '';
function buildCopyText(r){
  const f = r.fig;
  copyCache =
`【我的灵魂历史人物】${f.name}（${f.dyn}·${DIMS[r.top].name}型）
同频度 ${r.sync}% · 关键词：${f.tags.join('/')}
${f.quote}
第二底色：${r.secondName} · ${r.secondFigure}
—— 测测你的灵魂对应哪位中国历史人物`;
}

/* ============================================================
   8. 流程控制
   ============================================================ */
function start(){
  state.idx = 0;
  state.answers = new Array(TOTAL).fill(null);
  state.busy = false;
  show('quiz');
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function finish(){
  show('result');
  renderResult();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

/* ============================================================
   9. 事件绑定
   ============================================================ */
$('startBtn').addEventListener('click', start);
$('backBtn').addEventListener('click', back);
$('againBtn').addEventListener('click', start);

$('copyBtn').addEventListener('click', async () => {
  if (!copyCache) return;
  try {
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(copyCache);
    } else {
      const ta = document.createElement('textarea');
      ta.value = copyCache;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    toast('结果文案已复制');
  } catch (e){
    toast('复制失败，请长按选择文字');
  }
});

/* 键盘：1-4 选择，← 返回 */
document.addEventListener('keydown', e => {
  if (state.view !== 'quiz' || state.busy) return;
  if (e.key >= '1' && e.key <= '4'){
    const oi = parseInt(e.key, 10) - 1;
    if (oi < QS[state.idx].opts.length) choose(oi);
  } else if (e.key === 'ArrowLeft'){
    back();
  }
});

/* 手机端左右滑动返回上一题 */
let touchX = null, touchY = null;
document.addEventListener('touchstart', e => {
  if (state.view !== 'quiz') return;
  touchX = e.changedTouches[0].clientX;
  touchY = e.changedTouches[0].clientY;
}, { passive:true });
document.addEventListener('touchend', e => {
  if (state.view !== 'quiz' || touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (dx > 90 && Math.abs(dy) < 50) back();
  touchX = touchY = null;
}, { passive:true });
</script>
